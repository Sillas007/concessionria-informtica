<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Carro</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px;}
        .form-container { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block;}
        .btn:hover { background-color: #218838; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 th:text="${carro.id == null ? 'Novo Carro' : 'Editar Carro'}">Carro</h2>

        <form th:action="@{/carros/salvar}" th:object="${carro}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="modelo">Modelo:</label>
                <input type="text" id="modelo" th:field="*{modelo}" required />
            </div>

            <div class="form-group">
                <label for="ano">Ano:</label>
                <input type="number" id="ano" th:field="*{ano}" required />
            </div>

            <div class="form-group">
                <label for="faixaPreco">Faixa de Preço:</label>
                <input type="text" id="faixaPreco" th:field="*{faixaPreco}" placeholder="Ex: R$ 50.000 - R$ 80.000" />
            </div>

            <button type="submit" class="btn">Salvar</button>
            <a th:href="@{/carros}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

</body>
</html>
