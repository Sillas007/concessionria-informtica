<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Computador</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px;}
        .form-container { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block;}
        .btn:hover { background-color: #0056b3; }
        .btn-secondary { background-color: #6c757d; }
        .btn-secondary:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 th:text="${computador.id == null ? 'Novo Computador' : 'Editar Computador'}">Computador</h2>

        <form th:action="@{/computadores/salvar}" th:object="${computador}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="processador">Processador:</label>
                <input type="text" id="processador" th:field="*{processador}" placeholder="Ex: Intel Core i7" required />
            </div>

            <div class="form-group">
                <label for="ram">Memória RAM:</label>
                <input type="text" id="ram" th:field="*{ram}" placeholder="Ex: 16GB" required />
            </div>

            <div class="form-group">
                <label for="armazenamento">Armazenamento:</label>
                <input type="text" id="armazenamento" th:field="*{armazenamento}" placeholder="Ex: 512GB SSD" required />
            </div>

            <button type="submit" class="btn">Salvar</button>
            <a th:href="@{/computadores}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

</body>
</html>
