<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">OmniRoute</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/users/index}">Usuários</a>
            <a class="nav-link" th:href="@{/products/index}">Produtos</a>
        </div>
    </div>
</nav>
<div class="container pt-3">
    <a th:href="@{/users/index}" class="btn btn-outline-secondary float-end">Voltar</a>
    <h1>Editar Usuario</h1>
    <hr>
    <form th:action="@{/users/update/{id}(id=${user.id})}" method="post" style="max-width: 500px;">
        <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${user.name}" required>
        </div>
        <div class="mb-3">
            <label for="arroba" class="form-label">Arroba</label>
            <input type="text" class="form-control" id="arroba" name="arroba" th:value="${user.arroba}" required>
        </div>
        <div class="mb-3">
            <label for="cpf" class="form-label">CPF (Apenas números)</label>
            <input type="text" class="form-control" id="cpf" name="cpf" th:value="${user.cpf}" maxlength="11" pattern="\d{11}" required>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
